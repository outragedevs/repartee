name: Dependency policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check retired dependencies and regression fixtures
        run: make dependency-check
