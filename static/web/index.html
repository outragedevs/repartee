    <script>
      window.__rpPreviewError = function (img) {
        var card = img.closest('.msg-preview-card');
        if (!card) return;
        var s = card.closest('.chat-messages');
        var atBottom = s && s.dataset.followingTail === 'true';
        var above = false;
        if (s) {
          var cr = card.getBoundingClientRect();
          var sr = s.getBoundingClientRect();
          above = cr.bottom < sr.top;
        }
        var oldH = s ? s.scrollHeight : 0;
        var oldTop = s ? s.scrollTop : 0;
        card.style.display = 'none';
        if (!s) return;
        if (atBottom) {
          s.scrollTop = s.scrollHeight;
        } else if (above) {
          s.scrollTop = Math.max(0, oldTop - (oldH - s.scrollHeight));
        }
      };
    </script>
